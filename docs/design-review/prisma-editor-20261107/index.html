<!--
THESIS: The photograph owns the editor. A quiet, image-coloured workspace makes the effect tangible before any controls.
OWN-WORLD: User-pinned Prisma reference: photo-derived blur, charcoal circular tools, small square filmstrip, saturated yellow action. System sans for an Operate surface.
STORY: Choose a look, adjust its strength, compare with the original, compose, then export a new demonstration JPEG.
FIRST VIEWPORT: Three equal phone views on a pale blue/cream board; each has a slim header, contained 4:5 photograph, circular tools and a compact bottom workspace. A yellow export action anchors top right. On phones, one full-screen editor.
FORM: User-pinned reference 15854036; no concept roll. Interactive code prototype; signature interaction is live original/effect comparison with a movable seam.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->

    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>

  <header class="board-header">
    <div><h1><span class="wordmark">Huevia</span><span class="header-divider"></span>图片编辑</h1><p>从 Prisma 的沉浸画布出发，让照片成为主角。</p></div>
    <div class="view-switch" aria-label="原型展示方式"><button class="selected" data-view="overview" aria-pressed="true">设计总览</button><button data-view="single" aria-pressed="false">单屏体验</button></div>
  </header>
  <main class="design-board" aria-label="图片编辑交互原型">
    <section class="screen-column"><div class="editor" data-initial="filters" aria-label="滤镜编辑原型"></div><div class="screen-caption"><h2>沉浸选滤镜</h2><p>效果先行，强度随手调。</p></div></section>
    <section class="screen-column"><div class="editor" data-initial="adjust" aria-label="照片调节原型"></div><div class="screen-caption"><h2>轻量调色</h2><p>工具收在底部，目光留在照片。</p></div></section>
    <section class="screen-column"><div class="editor" data-initial="crop" aria-label="照片裁切原型"></div><div class="screen-caption"><h2>专注构图</h2><p>比例、旋转与三分网格。</p></div></section>
  </main>
  <footer class="board-footer"><p>可点击滤镜、拖动滑杆、切换工具；点击照片右上角的对比按钮，可拖动分割线。</p><p>本地交互原型 · 使用示意照片与 CSS 调色，不代表实际预设或人像算法。<a href="https://dribbble.com/shots/15854036-Prisma-Photo-Editor" target="_blank" rel="noreferrer">设计参考 ↗</a></p></footer>
</body>
