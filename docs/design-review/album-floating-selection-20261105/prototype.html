<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>相册 · 悬浮批量操作设计</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="symbols" aria-hidden="true"><defs>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
<symbol id="i-photo" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m4 18 5-6 4 4 3-4 5 6"/></symbol>
<symbol id="i-album" viewBox="0 0 24 24"><path d="M16 3H4a1 1 0 0 0-1 1v12"/><rect x="7" y="7" width="14" height="14" rx="2"/><path d="m8 18 4-5 3 3 2-2 3 4"/></symbol>
<symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 7h4l2-3h4l2 3h4v13H4z"/><circle cx="12" cy="13" r="4"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="m10 3-.6 2.3-2 .9-2.1-.8-2 3.4L5 10.4v2.3l-1.7 1.6 2 3.4 2.1-.8 2 .9.6 2.3h4l.6-2.3 2-.9 2.1.8 2-3.4-1.7-1.6v-2.3l1.7-1.6-2-3.4-2.1.8-2-.9L14 3z"/><circle cx="12" cy="11.6" r="3.2"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 18v3h14v-3"/></symbol>
<symbol id="i-signal" viewBox="0 0 24 24"><path d="M4 17v3M9 13v7M14 9v11M19 4v16"/></symbol>
</defs></svg>
<main class="review">
  <header class="review-head">
    <div><h1>相册 · 悬浮批量操作</h1><p class="intro">移除常驻选图入口。选择照片后，只留一条悬浮操作栏。</p></div>
    <div class="review-controls" aria-label="设计预览设置">
      <button id="theme-toggle" type="button" aria-pressed="false">深色预览</button>
      <button id="font-toggle" type="button" aria-pressed="false">放大字体</button>
    </div>
  </header>
  <div class="state-links" aria-label="定位设计状态"><a href="#browse">手机 · 浏览</a><a href="#phone-selected">手机 · 选择</a><a href="#app-selected">App 内 · 选择</a></div>
  <section class="designs" aria-label="三个相册设计状态">
    <figure id="browse" class="design"><figcaption><span>手机 · 浏览</span><small>只保留张数和选择</small></figcaption><div class="phone-slot" data-demo="browse"></div><div class="access-control"><span>权限预览</span><button id="access-full" class="chosen" aria-pressed="true">已授权</button><button id="access-none" aria-pressed="false">未授权</button></div></figure>
    <figure id="phone-selected" class="design"><figcaption><span>手机 · 选择</span><small>取消、数量、批量编辑同一行</small></figcaption><div class="phone-slot" data-demo="phone-selected"></div><p class="design-note">选择时收起底部导航，取消后恢复。</p></figure>
    <figure id="app-selected" class="design"><figcaption><span>App 内 · 选择</span><small>保留编辑和保存到手机</small></figcaption><div class="phone-slot" data-demo="app-selected"></div><p class="design-note">次要操作轻量显示，编辑保持主操作。</p></figure>
  </section>
  <footer class="review-foot"><p>可点击照片增减选择，体验取消与导航恢复。照片仅作示意。</p><p id="review-status" role="status" aria-live="polite">设计稿待审核，App 尚未改动。</p></footer>
</main>
<script src="prototype.js"></script>
</body></html>
