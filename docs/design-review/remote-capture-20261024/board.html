<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>遥控拍摄 · 设计总览</title><style>
*{box-sizing:border-box}body{margin:0;background:#F3EFE9;color:#262320;font-family:Roboto,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;padding:44px 48px 30px}main{width:1218px;margin:auto}h1{font-size:34px;font-weight:600;line-height:1.3;letter-spacing:-.025em;margin:0 0 12px}header p{font-size:14px;color:#706A63;margin:0;line-height:1.8}header{margin-bottom:29px}.boards{display:grid;grid-template-columns:repeat(3,390px);gap:24px}article h2{font-size:16px;font-weight:550;line-height:1.5;margin:0 0 12px}article p{color:#706A63;font-size:12px;line-height:1.8;margin:13px 0 0}iframe{display:block;border:0;border-radius:22px;width:390px;height:844px;background:#121313;box-shadow:0 14px 30px rgba(0,0,0,.1)}footer{border-top:1px solid #DCD5CC;margin-top:28px;padding-top:18px;color:#706A63;font-size:12px;line-height:1.8;display:flex;justify-content:space-between;gap:30px}body.landscape main{width:1000px}body.landscape .boards{display:block}body.landscape article{display:grid;grid-template-columns:844px 1fr;gap:16px}body.landscape article h2{grid-column:1/-1;margin-bottom:0}body.landscape iframe{width:844px;height:390px;border-radius:18px}body.landscape article p{font-size:12px;margin:0;line-height:2}body.landscape footer{margin-top:25px}.detail-list{margin:14px 0 0;padding:0;list-style:none;color:#706A63;font-size:12px;line-height:1.9}.detail-list li{padding:10px 0;border-top:1px solid #DCD5CC}
</style></head><body><main><header><h1 id="board-title">遥控拍摄</h1><p id="board-intro">Nikon Z6 II · 实时取景、机身参数和遥控快门。沿用现有 App 的暖白与杏色，拍摄时让界面退到画面之外。</p></header><section class="boards" id="boards"></section><footer><span>界面设计稿 · 等待审核<br>合成示例画面与模拟读数，不代表已接入真实相机。</span><span>2026-10-24 · 设计 v1<br>参数先只读；具体功能按机身能力启用。</span></footer></main><script>
const kind=new URLSearchParams(location.search).get('kind')||'main';const root=document.getElementById('boards');
const panels=kind==='states'?[['view-lost','取景中断，仍可遥控拍摄','清楚区分画面流与相机连接。停止点按对焦，保留可用的机身参数与快门。'],['offline','连接断开，停止发送指令','实时参数显示“—”，取景覆盖为断线状态。重新连接后再恢复操作。'],['timeout','先确认结果，再继续拍摄','未收到拍摄确认时不自动重发快门。提供查询最近照片的恢复入口。']]:[['entry','从“同步”进入','不增加根导航。进入独立拍摄工作区，返回后保留当前相机连接。'],['ready','看完整画面，轻点对焦','保持原始画面比例；快门、光圈、ISO 与曝光补偿集中在下方。'],['options','按需打开拍摄设置','实时取景和拍后传入独立开关。照片留在相机，JPEG 可另传入 App。']];
if(kind==='landscape'){document.body.classList.add('landscape');document.getElementById('board-title').textContent='横屏，把空间留给取景';document.getElementById('board-intro').textContent='取景在左，参数与快门在右；横屏重排，不把竖屏界面缩小塞进去。';root.innerHTML='<article><h2>横屏实时取景</h2><iframe title="横屏取景设计" src="prototype.html?embed=1&orientation=landscape&scene=ready"></iframe><div><p>完整画面<br>始终等比显示<br><br>小机型栏<br>状态与电量并列<br><br>独立控制区<br>大快门易触达</p></div></article>';}
else if(kind==='histogram'){document.getElementById('board-title').textContent='当前取景，也能看直方图';document.getElementById('board-intro').textContent='亮度与 RGB 可切换，小图可拖动、收起；画面暂停时直方图同步标明暂停。';root.innerHTML=[['ready','luma','亮度，一眼看曝光分布','小图先放留白，点按可放大；不因开关直方图而改变取景画面的大小。'],['ready','rgb','RGB，观察三通道','分开显示红、绿、蓝通道。所有曲线对应示例取景帧。'],['histogram','rgb','放大查看与切换','查看当前分布、切换模式或收起小图；支持触摸拖动到不挡主体的位置。']].map(([scene,hist,title,copy])=>`<article><h2>${title}</h2><iframe title="${title}" src="prototype.html?embed=1&scene=${scene}&hist=${hist}"></iframe><p>${copy}</p></article>`).join('');}
else{if(kind==='states'){document.getElementById('board-title').textContent='每一步，都知道相机在做什么';document.getElementById('board-intro').textContent='把取景、连接和拍摄结果分开表达；异常状态有明确的下一步。';}root.innerHTML=panels.map(([scene,title,copy])=>`<article><h2>${title}</h2><iframe title="${title}" src="prototype.html?embed=1&scene=${scene}"></iframe><p>${copy}</p></article>`).join('');}
window.boardReady=true;
</script></body></html>
