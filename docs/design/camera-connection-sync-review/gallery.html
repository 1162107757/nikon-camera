<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Huevia · 关键状态截图</title><style>
*{box-sizing:border-box}body{margin:0;padding:30px;background:#eeede9;color:#242320;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}header{margin-bottom:32px}h1{font-size:25px;font-weight:600;letter-spacing:-.7px;margin:16px 0 10px}p,a{font-size:13px;color:#635d53;line-height:1.8}a{text-underline-offset:4px}nav{display:flex;gap:8px 20px;flex-wrap:wrap}h2{font-size:18px;margin:36px 0 17px;font-weight:600}section{scroll-margin-top:24px}.grid{display:grid;grid-template-columns:repeat(4,375px);gap:22px}figure{margin:0}figcaption{font-size:11px;color:#635d53;margin:0 4px 10px}.grid img{width:375px;height:812px;display:block;border-radius:22px;box-shadow:0 7px 24px #24232014}footer{margin-top:35px;font-size:12px;color:#635d53}::selection{background:#f4d6c0}@media(max-width:1650px){.grid{grid-template-columns:repeat(2,375px)}}@media(max-width:820px){body{padding:22px 12px}.grid{grid-template-columns:minmax(0,375px);justify-content:center}.grid img{max-width:100%;height:auto}h1{font-size:23px}}
</style></head><body><header><a href="index.html">返回交互预览</a><h1>每个关键状态，都可以停下来审核。</h1><p>375 × 812 · Android / iOS · 浅色 / 深色。以下是本地 HTML 原型截图；所有设备、照片数量、任务、参数均为演示，不代表相机实测。</p><nav id="nav"></nav></header><main id="states"></main><footer>浏览器结构与交互检查见 review/browser-check.json。设计通过前不接入产品。</footer><script>
const states=[['wifi-ready','Wi-Fi · 连接准备'],['usb-ready','USB · 连接准备'],['usb-found','USB · 检测到相机'],['usb-missing','USB · 未发现设备'],['connecting','正在连接'],['camera-confirm','等待机身确认'],['permission','等待系统授权'],['permission-denied','权限未允许'],['timeout','连接超时'],['failed','连接失败'],['success-return','连接成功 · 返回同步页'],['sync-entry','同步页 · 单个浮动入口'],['sync-tools','相机工具 · 三个入口'],['queue-empty','下载队列 · 紧凑空状态'],['queue-active','下载队列 · 进行中'],['queue-failed','下载队列 · 可恢复的中断'],['remote','遥控拍照 · 全屏取景'],['remote-paused','遥控取景 · 已暂停'],['remote-waiting','遥控取景 · 等待画面'],['remote-unsupported','遥控取景 · 机型未提供'],['remote-uncertain','遥控拍摄 · 结果待核对'],['slots','相机预设槽位 · C1–C9'],['remote-offline','遥控拍照 · 相机未连接']];
document.querySelector('#nav').innerHTML=states.map(([key,label])=>`<a href="#${key}">${label}</a>`).join('');document.querySelector('#states').innerHTML=states.map(([key,label])=>`<section id="${key}"><h2>${label}</h2><div class="grid">${['android','ios'].flatMap(platform=>['light','dark'].map(theme=>`<figure><figcaption>${platform==='ios'?'iOS':'Android'} · ${theme==='light'?'浅色':'深色'}</figcaption><a href="review/${platform}-${theme}-${key}.png"><img src="review/${platform}-${theme}-${key}.png" loading="lazy" alt="${label}，${platform} ${theme}"></a></figure>`)).join('')}</div></section>`).join('');
</script></body></html>
