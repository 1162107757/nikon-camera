def hueviaRoute = { repos -> repos.all { repo ->
 if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
  def address = repo.url.toString()
  def routes = ['https://dl.google.com/dl/android/maven2/':'google', 'https://dl.google.com/android/maven2/':'google', 'https://repo.maven.apache.org/maven2/':'central', 'https://repo1.maven.org/maven2/':'central', 'https://plugins.gradle.org/m2/':'plugin', 'https://storage.googleapis.com/download.flutter.io/':'flutter']
  routes.each { origin, name -> if(address == origin || address + '/' == origin) {
   repo.url = 'http://127.0.0.1:52343/' + name + '/'; repo.allowInsecureProtocol = true
   repo.content {
    if(name == 'google') { includeGroupByRegex 'androidx[.].*'; includeGroupByRegex 'com[.]android([.].*)?'; includeGroupByRegex 'com[.]google[.]android([.].*)?'; includeGroupByRegex 'com[.]google[.]firebase([.].*)?'; includeGroupByRegex 'com[.]google[.]testing([.].*)?'; includeGroupByRegex 'com[.]google[.]prefab([.].*)?'; includeGroupByRegex 'org[.]chromium[.]net' }
    else if(name == 'flutter') { includeGroup 'io.flutter' }
    else { excludeGroup 'io.flutter'; excludeGroupByRegex 'androidx[.].*'; excludeGroupByRegex 'com[.]android([.].*)?'; excludeGroupByRegex 'com[.]google[.]android([.].*)?'; excludeGroupByRegex 'com[.]google[.]firebase([.].*)?'; excludeGroupByRegex 'com[.]google[.]testing([.].*)?'; excludeGroupByRegex 'com[.]google[.]prefab([.].*)?'; excludeGroupByRegex 'org[.]chromium[.]net' }
   }
  } }
 }
} }
