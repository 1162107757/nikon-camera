name: Cross-platform mobile development build
on:
  workflow_dispatch:
  push:
    branches: ['codex/cross-platform-migration']
    paths:
      - 'cross-platform/app/**'
      - 'cross-platform/native/**'
      - 'cross-platform/tool/mobile_apple.sh'
      - 'cross-platform/tool/raw_*.py'
      - '.github/workflows/cross-platform-mobile.yml'
permissions:
  contents: read
concurrency:
  group: shared-mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apple-app:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Identify the exact Apple compiler
        id: apple
        run: echo "xcode=$(xcodebuild -version | tr '\n ' '--')" >> "$GITHUB_OUTPUT"
      - name: Restore pinned native runtime outputs
        id: native-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            .tooling/cross-platform187/j2objc-3.1/dist
            .tooling/cross-platform187/j2objc-3.1/.huevia-file-varargs-v1
            cross-platform/.build/raw-apple
          key: huevia-apple-native-v1-${{ runner.arch }}-${{ steps.apple.outputs.xcode }}-${{ hashFiles('cross-platform/tool/core_ios.sh', 'cross-platform/tool/raw_apple.py', 'cross-platform/tool/raw_sources.py', 'cross-platform/toolchain.json') }}
      - name: Verify core parity and prepare native runtimes
        run: bash cross-platform/tool/mobile_apple.sh prepare
      - name: Preserve verified native runtime outputs
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            .tooling/cross-platform187/j2objc-3.1/dist
            .tooling/cross-platform187/j2objc-3.1/.huevia-file-varargs-v1
            cross-platform/.build/raw-apple
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Build and test the unsigned device app
        run: bash cross-platform/tool/mobile_apple.sh build
      - name: Show actionable build errors
        if: failure()
        run: |
          shopt -s nullglob
          for f in cross-platform/.build/mobile-apple/*.log; do
            echo "Log: $f"
            tail -n 35 "$f"
          done
      - name: Preserve development IPA and exact build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: huevia-cross-platform-ios-development
          path: |
            cross-platform/.build/mobile-apple/
            cross-platform/.build/core-ios/parity.json
            cross-platform/.build/core-ios/translation.log
          retention-days: 7
