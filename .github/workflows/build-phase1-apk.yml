name: Build Phase 1 APK

on:
  push:
    branches: [feature/phase1-wb-picker-dehaze]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      ANDROID_HOME: C:\Android\android-sdk
      ANDROID_SDK_ROOT: C:\Android\android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        shell: pwsh
        run: |
          $sdkRoot = $env:ANDROID_HOME
          Write-Output "ANDROID_HOME=$sdkRoot"
          $candidates = @(
            "$sdkRoot\cmdline-tools\latest\bin\sdkmanager.bat",
            "$sdkRoot\cmdline-tools\16.0\bin\sdkmanager.bat",
            "$sdkRoot\cmdline-tools\bin\sdkmanager.bat"
          )
          $sdk = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $sdk) { throw "sdkmanager.bat not found under $sdkRoot\cmdline-tools" }
          Write-Output "Using sdkmanager: $sdk"
          # Accept licenses first, then install only the packages the project script needs.
          # Do not use android-actions/setup-android: on current windows runners it tries
          # to install the obsolete 'tools' package and fails with exit code 1.
          try { 1..20 | ForEach-Object { "y" } | & $sdk --sdk_root="$sdkRoot" --licenses } catch { Write-Output "license step warning: $_" }
          & $sdk --sdk_root="$sdkRoot" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed" }
          if (-not (Test-Path "$sdkRoot\platforms\android-35\android.jar")) { throw "platform 35 not installed" }
          if (-not (Test-Path "$sdkRoot\build-tools\35.0.0")) { throw "build-tools 35.0.0 not installed" }
      - name: Restore official LibRaw sources from zip
        shell: pwsh
        run: |
          # build-raw-native.ps1 hashes every LibRaw source file against the official
          # zip. A Windows checkout can change line endings (CRLF) and make
          # install-sh and other text files hash-mismatch, even though the code
          # is unchanged. Overwrite the source tree with the exact zip bytes
          # before building, without changing the project scripts.
          $zipPath = "third-party/libraw/LibRaw-0.22.3.zip"
          if (-not (Test-Path $zipPath)) { throw "LibRaw archive not found: $zipPath" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName.EndsWith('/')) { continue }
              $target = Join-Path "third-party/libraw" $entry.FullName
              New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $target, $true)
            }
          } finally { $zip.Dispose() }
          Write-Output "LibRaw sources restored from official zip"
      - name: Build APK with project script
        shell: pwsh
        run: |
          ./scripts/build-apk.ps1 -SdkRoot $env:ANDROID_HOME
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: huevia-phase1-apk
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
