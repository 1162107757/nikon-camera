name: Build Phase 1 APK

on:
  push:
    branches: [feature/phase1-wb-picker-dehaze]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        shell: pwsh
        run: |
          $sdk = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $sdk)) { $sdk = "$env:ANDROID_HOME\cmdline-tools\bin\sdkmanager.bat" }
          & $sdk "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed" }
      - name: Build APK with project script
        shell: pwsh
        run: |
          ./scripts/build-apk.ps1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: huevia-phase1-apk
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
