// Load after cross-platform/legacy-android/overlay.gradle. Original sources stay read-only.
gradle.beforeProject { target ->
    target.pluginManager.withPlugin('com.android.application') {
        if (target.path != ':app') return
        target.androidComponents.finalizeDsl { config ->
            def workspace = target.rootProject.projectDir.canonicalFile
            def overlay = new File(workspace, 'legacy-android/jpeg-195').canonicalFile
            def exporter = new File(workspace, 'cross-platform/legacy-android').canonicalFile
            def source = new File(workspace, 'app/src/main/java').canonicalFile
            def buildRoot = new File(workspace, 'app/build').canonicalFile
            def expected = new File(workspace, 'app/build/generated/legacy-jpeg195/java').absoluteFile
            def generated = expected.canonicalFile
            def main = config.sourceSets.getByName('main')
            def exportManifest = new File(workspace, 'app/build/generated/legacy-export/AndroidManifest.xml').canonicalFile
            if (config.defaultConfig.applicationId != 'cc.huevia' ||
                    config.defaultConfig.versionCode != 194 ||
                    main.manifest.srcFile.canonicalFile != exportManifest) {
                throw new GradleException('Load the unchanged legacy export 194 overlay before JPEG 195')
            }
            if (generated != expected || !generated.toPath().startsWith(buildRoot.toPath()) ||
                    generated.toPath() == buildRoot.toPath() ||
                    !buildRoot.toPath().startsWith(workspace.toPath())) {
                throw new GradleException('Generated JPEG 195 source directory escaped app/build')
            }
            def patch = new File(overlay, 'patch_sources.py')
            if (!source.isDirectory() || !patch.isFile()) {
                throw new GradleException('Original Java sources or JPEG 195 patch_sources.py is missing')
            }
            // Files.walk does not follow symbolic links. Only the checked generated tree is removed.
            if (generated.exists()) {
                def previous = java.nio.file.Files.walk(generated.toPath())
                try {
                    previous.sorted(java.util.Comparator.reverseOrder()).forEach { entry ->
                        if (!entry.toAbsolutePath().normalize().startsWith(generated.toPath())) {
                            throw new GradleException('Generated JPEG 195 cleanup escaped its directory')
                        }
                        java.nio.file.Files.delete(entry)
                    }
                } finally { previous.close() }
            }
            java.nio.file.Files.createDirectories(generated.toPath())
            def originals = java.nio.file.Files.walk(source.toPath())
            try {
                originals.forEach { entry ->
                    if (java.nio.file.Files.isSymbolicLink(entry)) {
                        throw new GradleException('Original Java source tree must not contain symbolic links')
                    }
                    def destination = generated.toPath().resolve(source.toPath().relativize(entry))
                    if (java.nio.file.Files.isDirectory(entry)) {
                        java.nio.file.Files.createDirectories(destination)
                    } else if (java.nio.file.Files.isRegularFile(entry)) {
                        java.nio.file.Files.copy(entry, destination, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    } else {
                        throw new GradleException('Original Java source tree contains a non-regular entry')
                    }
                }
            } finally { originals.close() }
            def python = target.providers.gradleProperty('legacyJpegPython').orElse('python').get()
            target.exec {
                workingDir workspace
                commandLine python, patch.absolutePath, '--source', generated.absolutePath
            }
            // Keep the 194 export manifest and its pinned compatibility dependencies.
            // The generated tree replaces app/src/main/java, never supplements it.
            main.java.setSrcDirs([
                generated,
                new File(exporter, 'src'),
                new File(workspace, 'cross-platform/core/java'),
                new File(overlay, 'src')
            ])
            config.defaultConfig.applicationId = 'cc.huevia'
            config.defaultConfig.versionCode = 195
            config.defaultConfig.versionName = '0.30.35-beta-jpeg-fix'
        }
    }
}
